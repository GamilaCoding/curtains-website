name: 🚀 AI Dev Suite (Laravel 8 Optimized)

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-dev-suite:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. نظام الكاش لتسريع الأكشن (لن يتم تحميل الموديل كل مرة)
      - name: 💾 Cache Ollama Models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen-coder-1.5b
          restore-keys: |
            ollama-qwen-

      - name: 🦙 Install Ollama & Pull Model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          if [ "${{ steps.cache-ollama.outputs.cache-hit }}" != "true" ]; then
            echo "📥 Cache miss: Pulling qwen2.5-coder:1.5b..."
            ollama pull qwen2.5-coder:1.5b
          fi

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # --- الخطوة التي كانت ناقصة وتسببت في الخطأ ---
      - name: 📦 Install Python Dependencies
        run: pip install requests

      - name: 🤖 Generate Docs & Unit Tests
        run: |
          python << 'EOF'
          import os, requests, subprocess

          MODEL_NAME = "qwen2.5-coder:1.5b"
          target_dirs = ["app/Http/Controllers", "app/Models", "app/Services"]

          try:
              changed_files = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD']).decode('utf-8').splitlines()
          except:
              changed_files = []

          all_updates = ""

          for path in changed_files:
              if any(path.startswith(d) for d in target_dirs) and path.endswith(".php") and os.path.exists(path):
                  print(f"🧠 AI is working on: {path}")
                  with open(path, 'r') as f:
                      code_content = f.read()

                  # 1. توليد التوثيق
                  doc_prompt = f"Create a markdown table for these PHP functions. Columns: Name, Parameters, Description. ONLY the table.\n\n{code_content}"
                  try:
                      res_doc = requests.post("http://localhost:11434/api/generate",
                                            json={"model": MODEL_NAME, "prompt": doc_prompt, "stream": False}, timeout=120)
                      if res_doc.status_code == 200:
                          all_updates += f"\n### 📄 {path}\n{res_doc.json().get('response', '')}\n"
                  except Exception as e: print(f"❌ Doc Error: {e}")

                  # 2. توليد Unit Test لـ Laravel 8
                  test_prompt = f"Write a Laravel 8 PHPUnit Test class for this code. Use proper namespaces and follow PSR-12. Return ONLY the PHP code starting with <?php.\n\n{code_content}"
                  try:
                      res_test = requests.post("http://localhost:11434/api/generate",
                                             json={"model": MODEL_NAME, "prompt": test_prompt, "stream": False}, timeout=180)
                      if res_test.status_code == 200:
                          test_code = res_test.json().get('response', '')
                          filename = os.path.basename(path).replace(".php", "Test.php")
                          test_path = os.path.join("tests/Feature", filename)
                          os.makedirs(os.path.dirname(test_path), exist_ok=True)
                          with open(test_path, 'w') as f_test:
                              f_test.write(test_code)
                          print(f"✅ Test Generated: {test_path}")
                  except Exception as e: print(f"❌ Test Error: {e}")

          if all_updates:
              header = "# 📘 AI Generated Documentation\n\n"
              existing = ""
              if os.path.exists("TECHNICAL_DOCS.md"):
                  with open("TECHNICAL_DOCS.md", "r") as f:
                      existing = f.read().replace(header, "")
              with open("TECHNICAL_DOCS.md", "w") as f:
                  f.write(header + all_updates + "\n---\n" + existing)
          EOF

      - name: 📤 Push Changes
        run: |
          git config --global user.name 'AI Developer Bot'
          git config --global user.email 'ai-bot@veinlink.com'
          git add TECHNICAL_DOCS.md tests/
          git commit -m "docs & tests: auto-generate via AI [skip ci]" || exit 0
          git push
